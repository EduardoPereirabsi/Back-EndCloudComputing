server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/messages
spring.datasource.username=root
spring.datasource.password=root

# O token e emitido via localhost (fora da rede Docker), entao o 'iss' vem com localhost.
# Ja as chaves publicas sao buscadas pelo nome interno do container.
app.security.issuer=${OIDC_ISSUER:http://localhost:8080/realms/lab}
app.security.jwk-set-uri=${OIDC_JWKS:http://keycloak:8080/realms/lab/protocol/openid-connect/certs}
app.security.audience=${OIDC_AUDIENCE:lab-api}
